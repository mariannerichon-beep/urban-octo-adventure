.bar .bt{flex:1;height:10px;border-radius:6px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--z);border-radius:6px}

</style>

 "xcalls": [["09 72 39 40 50", "SOS Amitié · écoute anonyme · 24h/24"]], "car": {"open": {"ado": ["Je pense beaucoup à la personne qui est partie. Tu veux bien qu’on en parle ?", "Je ne sais pas ce que je ressens, c’est bizarre.", "J’aimerais qu’on se souvienne d’elle ensemble."], "parent": ["Tu veux qu’on parle de lui ou d’elle ensemble ?", "Qu’est-ce qui te manque le plus ?", "De quoi aurais-tu besoin en ce moment ?"]}}, "quiz": [{"s": "Il faut être fort et ne pas pleurer devant les autres.", "a": false, "e": "Pleurer ou non ne mesure pas l’amour. Chacun vit son deuil à sa façon."}, {"s": "Un ado qui rit ou joue après un deuil n’est pas touché.", "a": false, "e": "Les ados alternent souvent tristesse et moments légers : c’est une façon de souffler."}, {"s": "Le deuil dure une durée précise.", "a": false, "e": "Il n’y a pas de durée standard : les vagues reviennent, parfois longtemps après. Un soutien professionnel peut aider si c’est trop lourd."}]};

const cs=(k,items)=>items.map(c=>`<button class="chip" data-s="${k}" data-c="${esc(c)}" aria-pressed="${cur[k]===c}">${c}</button>`).join("");
function J(){
 const j=pk(C.j),t=iso(new Date());
 const list=Object.keys(JJ()).sort().reverse().slice(0,7).map(k=>{const x=JJ()[k];return `<div class="row"><span class="e">${W[wi(x.lvl)][0]}</span><div class="t"><b>${ld(k)}</b> · ${x.lvl}/10<br><span class="sub">${esc(j.singles.map(s=>x[s.k]||"").filter(Boolean).join(" · "))}${x[j.texts[0].k]?" — "+esc(x[j.texts[0].k].slice(0,60)):""}</span></div><button class="x" data-del="${k}" aria-label="Supprimer le ${ld(k)}">✕</button></div>`}).join("")||`<p class="sub" style="margin:0">Pas encore de jour noté.</p>`;
 return `<div class="pop"><h1 style="font-size:1.7rem;margin-bottom:6px">📓 Mon journal</h1><p class="sub">${j.intro}</p>
 <section class="card"><h2>Quel jour ?</h2><input type="date" id="jdate" value="${jd}" max="${t}" aria-label="Date"><p class="sub" style="margin:8px 0 0">${ld(jd)}</p></section>
 <section class="card slider"><h2>${j.q}</h2>${wxs("ja",cur.lvl)}<input type="range" id="ja" min="0" max="10" value="${cur.lvl}" aria-label="${esc(j.q)}"><p class="sub" style="margin:0">0 = ${j.lo} · 10 = ${j.hi}</p></section>
 ${j.singles.map(s=>`<section class="card"><h2>${s.q}</h2><div class="chips">${cs(s.k,s.items)}</div></section>`).join("")}
 ${j.multis.map(s=>`<section class="card"><h2>${s.q}</h2><div class="chips">${cj(s.k,s.items)}</div></section>`).join("")}
 <section class="card">${j.texts.map(s=>`<h2>${s.q}</h2><textarea data-jt="${s.k}" placeholder="${esc(s.ph)}">${esc(cur[s.k])}</textarea>`).join("")}</section>
 <div class="nav"><button class="btn" id="jsave">Enregistrer cette journée</button></div><p class="sub" id="jm" style="margin:8px 0 16px"></p>
 <section class="card"><h2>Mes derniers jours</h2>${list}</section></div>`;
}
function E(){
 const j=pk(C.j),es=Object.keys(JJ()).sort().slice(-14).map(k=>({d:k,...blank(),...JJ()[k]})),n=es.length;
 const h=`<div class="pop"><h1 style="font-size:1.7rem;margin-bottom:6px">📈 Mon suivi</h1>`;
 if(n<2)return h+`<section class="card"><p>Note au moins 2 jours dans ton journal pour voir ta courbe. Tu en as ${n} pour l’instant.</p><div class="nav"><button class="btn" data-tab="j">Aller au journal</button></div></section></div>`;
 const avg=a=>a.reduce((s,x)=>s+x.lvl,0)/a.length,m=Math.floor(n/2);
 const tr=n<4?"":(d=>d>=1?C.e.up:d<=-1?C.e.down:C.e.flat)(avg(es.slice(m))-avg(es.slice(0,m)));
 const cnt=a=>{const o={};a.forEach(c=>o[c]=(o[c]||0)+1);return Object.entries(o).sort((a,b)=>b[1]-a[1])};
 const bars=(a,tot)=>a.length?a.map(([c,v])=>`<div class="bar"><span>${c}</span><div class="bt"><i style="width:${Math.round(v/Math.max(tot,1)*100)}%"></i></div><b>${v}</b></div>`).join(""):`<p class="sub" style="margin:0">Rien noté pour l’instant.</p>`;
 const good=es.filter(e=>e.lvl>=6),hk=j.helpKey,top=cnt((good.length?good:es).flatMap(e=>e[hk])).slice(0,3);
 const Wd=360,H=170,p=28,x=i=>p+i*(Wd-2*p)/(n-1),y=v=>H-26-v*(H-50)/10;
 let sv=`<svg viewBox="0 0 ${Wd} ${H}" style="width:100%;height:auto" role="img" aria-label="Courbe">`;
 [0,5,10].forEach(v=>sv+=`<line x1="${p}" x2="${Wd-p}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-dasharray="3 5"/><text x="2" y="${y(v)+4}" font-size="11" fill="var(--mut)">${v}</text>`);
 sv+=`<polyline fill="none" stroke="var(--z)" stroke-width="3" stroke-linejoin="round" points="${es.map((e,i)=>x(i)+","+y(e.lvl)).join(" ")}"/>`;
 es.forEach((e,i)=>sv+=`<circle cx="${x(i)}" cy="${y(e.lvl)}" r="5" fill="${C.flag(e)?"var(--c2)":"var(--z)"}"/>`);
 sv+=`<text x="${p}" y="${H-6}" font-size="11" fill="var(--mut)">${sd(es[0].d)}</text><text x="${Wd-p}" y="${H-6}" font-size="11" fill="var(--mut)" text-anchor="end">${sd(es[n-1].d)}</text></svg>`;
 const dist=j.singles.map(s=>({q:s.q,a:cnt(es.map(e=>e[s.k]).filter(Boolean))}));
 const warn=C.warn(es,avg);
 const txt=`${C.name} · bilan sur ${n} jours (${S.role==="ado"?"côté ado":"côté parent"})\n${j.q} : ${avg(es).toFixed(1)}/10 en moyenne\n${tr}\n${dist.map(d=>d.q+" : "+d.a.map(a=>a[0]+" ("+a[1]+")").join(", ")).join("\n")}\nCe qui aide : ${top.map(a=>a[0]+" ("+a[1]+")").join(", ")}`;
 return h+(warn?`<div class="alert">${warn}</div>`:"")+`<section class="card"><h2>${j.q}</h2>${sv}<p class="sub" style="margin:8px 0 0">${C.flagTxt}</p>${tr?`<p style="margin:10px 0 0"><b>${tr}</b></p>`:""}<p class="sub" style="margin:8px 0 0">Moyenne : ${avg(es).toFixed(1)}/10 sur ${n} jours.</p></section>
 ${dist.map(d=>`<section class="card"><h2>${d.q}</h2>${bars(d.a,n)}</section>`).join("")}
 <section class="card"><h2>Ce qui aide dans les bons jours</h2>${bars(top,(good.length?good:es).length)}</section>
 <section class="card"><h2>Mon bilan à partager</h2><textarea id="bilan" readonly style="min-height:150px">${esc(txt)}</textarea><div class="nav"><button class="btn" id="copy" data-src="bilan">Copier mon bilan</button></div><p class="sub" id="msg" style="margin:8px 0 0">À partager si tu le souhaites, par exemple pour en discuter ensemble ou avec un professionnel.</p></section>
 <div class="nav"><button class="btn" data-tab="j">📓 Ajouter un jour</button><button class="btn ghost" id="jreset">Effacer le journal</button></div></div>`;
}
const qk=q=>{const r=pk(q);return `<div class="pop"><div class="hero">${C.hero}</div><h1>${C.name}</h1>${r.cards.map((c,i)=>`<section class="card"${i?"":' style="margin-top:14px"'}><h2>${c.h}</h2>${c.ul?`<ul class="steps">${c.ul.map(x=>`<li>${x}</li>`).join("")}</ul>`:c.car?car(c.car):c.quiz?quizH():c.html||""}</section>`).join("")}<div class="nav"><button class="btn" data-tab="p">🧭 Faire mon parcours</button></div></div>`};
if(!C.quick)C.quick=()=>qk(C.qd);
if(!C.flag)C.flag=e=>C.flagSpec?(e[C.flagSpec.k]||"")[0]===C.flagSpec.ch:false;
if(!C.warn)C.warn=(es,avg)=>{const w=C.warnSpec;if(!w)return "";if(w.t==="flag")return es.slice(-w.of).filter(C.flag).length>=w.n?w.msg:"";return es.length>=w.n&&avg(es.slice(-w.n))<=w.thr?w.msg:""};
function render(keep){
 $("#app").style.setProperty("--z",tab==="p"?(C.steps[step].c||"var(--c1)"):"var(--c1)");
 $("#app").innerHTML=head()+(tab==="c"?C.quick():tab==="p"?P():tab==="j"?J():E());if(!keep)window.scrollTo(0,0);
}
document.addEventListener("click",e=>{
 const t=e.target.closest("button");if(!t)return;
 const d=t.dataset;
 if(d.role){S.role=d.role;save();load();render(true);return}
 if(d.tab){tab=d.tab;render();return}
 if(d.go){step=Math.max(0,Math.min(C.steps.length-1,step+ +d.go));render();return}
 if(d.k){const a=D()[d.k],i=a.indexOf(d.c);if(i>=0)a.splice(i,1);else a.push(d.c);t.setAttribute("aria-pressed",i<0);save();return}
 if(d.j){const a=cur[d.j],i=a.indexOf(d.c);if(i>=0)a.splice(i,1);else a.push(d.c);t.setAttribute("aria-pressed",i<0);return}
 if(d.s){const was=cur[d.s]===d.c;cur[d.s]=was?"":d.c;document.querySelectorAll(`[data-s="${d.s}"]`).forEach(b=>b.setAttribute("aria-pressed",cur[d.s]===b.dataset.c));return}
 if(d.car){const a=C.car[d.car][S.role];idx[d.car]++;$("#car_"+d.car).textContent=a[idx[d.car]%a.length];return}
 if(d.qa!==undefined){const q=C.quiz[qz.i%C.quiz.length];$("#qres").innerHTML=`<div class="alert" style="border-color:var(--c1)"><b>${q.a?"Réalité.":"Mythe."}</b> ${q.e}</div><button class="chip" data-qn="1">Une autre affirmation</button>`;return}
 if(d.qn){qz.i++;$("#quizbox").outerHTML=quizH();return}
 if(d.del){delete JJ()[d.del];save();load();render(true);return}
 if(t.id==="jsave"){JJ()[jd]=JSON.parse(JSON.stringify(cur));save();render(true);$("#jm").textContent="Enregistré ✅ Merci d’avoir pris ce temps.";return}
 if(t.id==="copy"){const r=$("#"+d.src),m=$("#msg"),f=()=>{r.select();m.textContent="Sélectionné : copie-le à la main."};
  try{navigator.clipboard.writeText(r.value).then(()=>m.textContent="Copié ✅",f)}catch(x){f()}return}
 if(t.id==="reset"&&confirm("Effacer ton parcours (le journal est conservé) ?")){const o=D();KA.forEach(k=>o[k]=[]);KT.forEach(k=>o[k]="");save();step=0;render()}
 if(t.id==="jreset"&&confirm("Effacer tout ton journal ?")){S.J[S.role]={};save();load();render()}
});
document.addEventListener("input",e=>{
 const t=e.target;
 if(t.dataset&&t.dataset.x){D()[t.dataset.x]=t.value;save();const r=$("#recap");if(r)r.value=recap();const q=$("#mjp");if(q)q.textContent=mjp()}
 if(t.dataset&&t.dataset.jt)cur[t.dataset.jt]=t.value;
 if(t.id==="ja"){cur.lvl=+t.value;const w=W[wi(cur.lvl)];$("#jaX").textContent=w[0];$("#jaL").textContent=w[1]+" · "+cur.lvl+"/10"}
 if(t.id==="jdate"){jd=t.value||iso(new Date());load();render(true)}
});
render();
</script>
</body>
</html>
