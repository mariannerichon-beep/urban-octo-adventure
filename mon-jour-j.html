<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mon jour J</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFF7EE;--ink:#2B1B12;--card:#FFFFFF;--mut:#7A5C4B;--line:#F0DCCB;--c1:#BF3F08;--c2:#2563C9;--c3:#1D7F4E;--c4:#7A3FC4;--on:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1C130E;--ink:#FFF1E6;--card:#2A1D16;--mut:#D0B3A0;--line:#4A3427;--c1:#FF9A62;--c2:#7FB0FF;--c3:#6FE0A0;--c4:#C7A2FF;--on:#1C130E}}
:root[data-theme="dark"]{--bg:#1C130E;--ink:#FFF1E6;--card:#2A1D16;--mut:#D0B3A0;--line:#4A3427;--c1:#FF9A62;--c2:#7FB0FF;--c3:#6FE0A0;--c4:#C7A2FF;--on:#1C130E}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Outfit",system-ui,sans-serif;font-weight:400;font-size:17px;line-height:1.5}
main{max-width:560px;margin:0 auto;padding:14px 18px 40px;--z:var(--c1)}
h1,h2{font-weight:700;line-height:1.2;margin:0}
h1{font-size:2.1rem}
h2{font-size:1.12rem;margin-bottom:10px}
p{margin:0 0 12px}
b{font-weight:700}
.sub{color:var(--mut)}
.bar2{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:8px 12px;font-size:.82rem;margin-bottom:12px;text-align:center}
.bar2 a{color:var(--c1);font-weight:700;text-decoration:none}
.tabs,.seg{display:flex;gap:3px;margin:2px 0 16px;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:4px}
.tabs button,.seg button{flex:1;font:inherit;font-weight:500;font-size:.82rem;border:0;background:transparent;color:var(--ink);border-radius:999px;padding:9px 2px;cursor:pointer}
.tabs button[aria-selected="true"],.seg button[aria-pressed="true"]{background:var(--z);color:var(--on);font-weight:700}
.seg button{font-size:.9rem}
.dots{display:flex;gap:5px;margin:6px 0 22px}
.dots i{flex:1;height:7px;border-radius:8px;background:var(--line)}
.dots i.on{background:var(--z)}
.hero{font-size:3rem;line-height:1;margin:4px 0 10px}
.card{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:18px;margin-bottom:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{font:inherit;font-weight:500;font-size:.92rem;text-align:left;color:var(--ink);background:transparent;border:2px solid var(--line);border-radius:18px;padding:8px 14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--z);border-color:var(--z);color:var(--on);font-weight:700}
textarea,input[type=date]{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:16px;padding:12px 14px;resize:vertical}
textarea{min-height:70px}
textarea:focus,input:focus-visible,.chip:focus-visible,.btn:focus-visible,.tabs button:focus-visible,.seg button:focus-visible,.x:focus-visible,.call:focus-visible{outline:3px solid var(--z);outline-offset:2px}
.nav{display:flex;gap:12px;margin-top:8px}
.btn{font:inherit;font-weight:700;font-size:1.02rem;border:0;border-radius:999px;padding:12px 22px;cursor:pointer;background:var(--z);color:var(--on);flex:1}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line);flex:0 0 auto}
.slider{text-align:center}
.wx{font-size:2.8rem;line-height:1.1}
.lab{font-weight:700;font-size:1.05rem}
input[type=range]{width:100%;accent-color:var(--z);margin:10px 0 4px}
.alert{background:var(--card);border:2px solid var(--c1);border-radius:16px;padding:12px 14px;margin:10px 0 16px;text-align:left;font-size:.95rem}
.calls{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.call{display:block;text-decoration:none;color:var(--ink);background:var(--card);border:2px solid var(--c1);border-radius:16px;padding:10px 14px}
.call b{font-size:1.2rem;color:var(--c1)}
.call span{display:block;font-size:.85rem;color:var(--mut)}
.stage{display:flex;flex-direction:column;align-items:center;padding:10px 0}
.orb{width:160px;height:160px;border-radius:50%;background:var(--z);opacity:.85;transform:scale(.6);display:flex;align-items:center;justify-content:center;font-size:3rem}
.bmsg{margin:14px 0;min-height:3em;text-align:center;font-weight:700}
.big{font-size:1.2rem;font-weight:700;line-height:1.4;min-height:3.6em}
.note{font-size:.9rem;color:var(--mut);border-left:4px solid var(--c3);padding-left:12px;margin:18px 0}
.steps{margin:0;padding-left:1.2em}
.steps li{margin-bottom:8px}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:2px solid var(--line)}
.row:first-of-type{border-top:0}
.row .e{font-size:1.8rem}
.row .t{flex:1;font-size:.93rem;min-width:0}
.x{font:inherit;border:0;background:transparent;color:var(--mut);font-size:1.1rem;cursor:pointer;padding:8px}
.bar{display:flex;align-items:center;gap:8px;margin:8px 0;font-size:.9rem}
.bar span{flex:0 0 52%}
.bar .bt{flex:1;height:10px;border-radius:6px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--z);border-radius:6px}
@media (prefers-reduced-motion:no-preference){.pop{animation:pop .35s ease-out}@keyframes pop{from{transform:scale(.97);opacity:.4}to{transform:none;opacity:1}}}
@media (prefers-reduced-motion:reduce){.orb{transition:none!important}}
</style>
</head>
<body>
<main id="app"></main>
<script>
const W=[["😌","Détendu"],["🙂","Un peu tendu"],["😬","Tendu"],["😰","Très tendu"],["🤯","Au maximum"]],wi=v=>Math.min(4,Math.floor(v/2.2));
const PH={a:["Mon corps se prépare : ce que je ressens, c’est de l’énergie.","Mon objectif : faire de mon mieux, pas être parfait.","J’ai préparé ce que je pouvais. Maintenant, je me fais confiance.","Je me concentre sur la prochaine étape, pas sur le résultat.","Être stressé, c’est le signe que ça compte pour moi, pas que je vais échouer."],
p:["Une pause, c’est permis. Je respire.","Un trou noir se voit beaucoup moins de l’extérieur que de l’intérieur.","Je reviens à la prochaine petite étape.","Je n’ai pas besoin d’être parfait pour bien faire."],
d:["Ce n’est pas un verdict sur ma valeur.","J’ai fait de mon mieux avec ce que j’avais.","Chaque fois, j’apprends quelque chose.","Je me parle comme je parlerais à un ami."]};
const TH=["💥 Et si je rate ?","🕳️ Et si j’ai un trou noir ?","👀 Ils vont voir que je suis stressé","🏆 Je dois être parfait","😞 Les autres sont meilleurs que moi","👨‍👩‍👧 Je vais décevoir mes proches","🔁 Je rumine après coup"];
const TOOLS=["🌬️ Respiration lente","🎬 Visualisation","🗣️ Phrase pour moi","🎧 Musique","💆 Relâcher épaules et mâchoire","🚶 Marcher avant","⏰ Arriver en avance","📝 Routine préparée","🤝 Répéter devant quelqu’un"];
const EV=["📝 Contrôle, examen","🎤 Oral","🎭 Scène, concert","⚽ Match, compétition","🏁 Entretien, concours","✨ Autre"],FE=["😄 Mieux que prévu","🙂 Comme prévu","😕 Moins bien","😣 Difficile"];
const PS=[{id:"intro"},
{id:"sit",e:"🎯",n:"1. Ce qui met la pression",c:"var(--c1)",i:"Un peu de tension aide à être alerte. Quand ça déborde, la performance en souffre. Repère d’où vient la pression.",secs:[{t:"chips",k:"sit",q:"Mes situations",items:["📝 Contrôle, examen","🎤 Oral","🎭 Scène, concert, théâtre","⚽ Compétition","🏁 Entretien, concours","📱 Me montrer, poster","👥 Être regardé et jugé","👨‍👩‍👧 Les attentes de mes proches","🏆 La note, le classement","🪞 Me comparer"],x:"sitT",ph:"La situation qui me stresse le plus…"}]},
{id:"corps",e:"🫀",n:"2. Ce que mon corps fait",c:"var(--c2)",i:"Ces réactions sont de l’énergie qui se prépare. Les connaître évite qu’elles surprennent.",secs:[{t:"chips",k:"body",q:"Ce que je ressens",items:["💓 Cœur qui s’emballe","🤲 Mains moites ou tremblantes","🕳️ Trou noir","🤢 Ventre noué","🗣️ Voix qui tremble","🏜️ Bouche sèche","🦵 Jambes qui flageolent","😮‍💨 Souffle court","😴 Nuit agitée la veille"],x:"bodyT",ph:"Comment ça se passe pour moi…"}]},
{id:"pens",e:"💭",n:"3. Mes pensées",c:"var(--c4)",i:"Avant une performance, l’esprit anticipe le pire. Ce sont des prédictions, pas des certitudes.",secs:[{t:"chips",k:"pens",q:"Celles qui reviennent",items:TH,x:"pensT",ph:"La pensée qui revient le plus souvent…"}]},
{id:"rec",e:"🔍",n:"4. Prendre du recul",c:"var(--c3)",i:"Teste ta pensée la plus fréquente : est-elle aussi probable et aussi grave qu’elle en a l’air ?",secs:[{t:"text",x:"rf1",q:"Le pire qui pourrait arriver, et comment je m’en sortirais",ph:"Même dans ce cas, je pourrais…"},{t:"text",x:"rf2",q:"Ce qui est le plus probable",ph:"Le plus probable, c’est que…"},{t:"text",x:"rf3",q:"Ce que je dirais à un ami qui pense ça",ph:"Avec bienveillance…"}]},
{id:"prep",e:"📚",n:"5. Ma préparation",c:"var(--c1)",i:"La confiance se construit : préparer, répéter, bien dormir. Pas besoin de tout faire.",secs:[{t:"chips",k:"prep",q:"Ce qui me prépare le mieux",items:["📚 Réviser par petites étapes","🗓️ Un planning réaliste","🎬 Répéter dans les conditions réelles","🧠 Visualiser une réussite","😴 Dormir suffisamment","🍎 Manger et boire normalement","🤝 Répéter devant quelqu’un","🚫 Éviter la révision de dernière minute"],x:"prepT",ph:"Mon plan de préparation en 3 étapes…"}]},
{id:"plan",e:"🗺️",n:"6. Ma routine du jour J",c:"var(--c2)"}];
const KA=["sit","body","pens","prep"],KT=["sitT","bodyT","pensT","rf1","rf2","rf3","prepT","rA","rB","rC","obj","aft1","aft2","aft3"];
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
const iso=d=>new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const ld=k=>new Date(k+"T12:00:00").toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"}),sd=k=>k.slice(8)+"/"+k.slice(5,7);
let S=null,step=0,tab="c",md="a",bt=[],jd=iso(new Date()),cur,pi=0;
try{S=JSON.parse(localStorage.getItem("ado_jourj")||"null")}catch(e){}
S=S||{};KA.forEach(k=>S[k]=S[k]||[]);KT.forEach(k=>S[k]=S[k]||"");S.J=S.J||{};
const save=()=>{try{localStorage.setItem("ado_jourj",JSON.stringify(S))}catch(e){}};
const stopB=()=>{bt.forEach(clearTimeout);bt=[]};
const blank=()=>({ev:"",bef:5,dur:4,feel:"",tried:[],note:""});
const load=()=>{cur=Object.assign(blank(),JSON.parse(JSON.stringify(S.J[jd]||{})))};load();
const calls=()=>`<div class="calls"><a class="call" href="tel:0800235236"><b>📞 0 800 235 236</b><span>Fil Santé Jeunes · 12-25 ans · anonyme · 9h-23h</span></a><a class="call" href="tel:3114"><b>📞 3114</b><span>Idées noires, envie de se faire du mal · gratuit · 24h/24</span></a></div>`;
const tabs=()=>`<div class="bar2">Si ça devient trop lourd : <a href="tel:0800235236">0 800 235 236</a> (Fil Santé Jeunes) · Idées noires : <a href="tel:3114">3114</a></div><div class="tabs" role="tablist">${["c","p","j","e"].map((k,i)=>`<button role="tab" data-tab="${k}" aria-selected="${tab===k}">${["🎯 Jour J","🧭 Plan","📓 Journal","📈 Suivi"][i]}</button>`).join("")}</div>`;
const nav=l=>`<div class="nav">${step?`<button class="btn ghost" data-go="-1">Retour</button>`:""}${l?`<button class="btn" data-go="1">${l}</button>`:""}</div>`;
const ta=(x,ph,m)=>`<textarea data-x="${x}" placeholder="${ph}"${m?` style="min-height:${m}px"`:""}>${esc(S[x])}</textarea>`;
const wxs=(id,v)=>{const w=W[wi(v)];return `<div class="wx" id="${id}X">${w[0]}</div><div class="lab" id="${id}L">${w[1]} · ${v}/10</div>`};
const orb=()=>`<div class="stage"><div class="orb" id="orb" aria-hidden="true">🌬️</div></div><div class="bmsg" id="bmsg" aria-live="polite">Inspire par le nez, souffle longtemps par la bouche.</div><div class="nav"><button class="btn" id="bstart">Commencer</button></div>`;
function C0(){
 let b="";
 if(md==="a")b=`<section class="card"><h2>Ce que tu ressens, c’est de l’énergie</h2><p style="margin:0">Le cœur qui bat vite, les mains moites : ton corps se prépare. Un peu de tension t’aide à être alerte. Tu peux te dire : « Mon corps se met en route pour moi. »</p></section>
 <section class="card"><h2>Respire 1 minute</h2>${orb()}</section>
 <section class="card"><h2>Mon objectif aujourd’hui</h2><p class="big" style="min-height:0;margin:0">${esc(S.obj||"Faire de mon mieux, pas être parfait.")}</p>${S.rB?`<p class="sub" style="margin:10px 0 0"><b>Ma routine :</b> ${esc(S.rB)}</p>`:""}</section>`;
 else if(md==="p")b=`<section class="card"><h2>Trou noir ou stress qui monte ? 4 gestes</h2><ol class="steps"><li><b>Pause.</b> Tu as le droit de te taire 3 secondes.</li><li><b>Souffle.</b> Une longue expiration lente.</li><li><b>Un repère.</b> Tes notes, ta dernière phrase, un point devant toi.</li><li><b>Reprends.</b> Dis-toi : « Je reprends. » Les autres remarquent rarement le trou noir.</li></ol>${S.rC?`<p class="sub" style="margin:10px 0 0"><b>Mon plan perso :</b> ${esc(S.rC)}</p>`:""}</section>
 <section class="card"><h2>Une respiration</h2>${orb()}</section>`;
 else b=`<section class="card"><h2>Mon debrief bienveillant</h2><p class="sub">Trois questions, puis tu fermes le sujet.</p><p style="margin-bottom:6px"><b>Ce qui s’est bien passé, même petit</b></p>${ta("aft1","Une chose que j’ai réussie…",60)}<p style="margin:10px 0 6px"><b>Ce que j’ai appris, ce que je referai</b></p>${ta("aft2","La prochaine fois, je…",60)}<p style="margin:10px 0 6px"><b>Ce que je dirais à un ami à ma place</b></p>${ta("aft3","Avec bienveillance…",60)}</section>
 <p class="note">Ressasser ne fait pas progresser : une fois le debrief fait, tu peux fermer le sujet. Note l’événement dans ton journal pour suivre ton évolution.</p><div class="nav"><button class="btn" data-tab="j">📓 Noter dans mon journal</button></div>`;
 return `<div class="pop"><div class="hero">🎯</div><h1>Mon jour J</h1>
 <div class="seg" style="margin-top:14px">${[["a","Avant"],["p","Pendant"],["d","Après"]].map(([k,l])=>`<button data-m="${k}" aria-pressed="${md===k}">${l}</button>`).join("")}</div>${b}
 <section class="card"><h2>Une phrase pour toi</h2><p class="big" id="ph">${PH[md][pi%PH[md].length]}</p><button class="chip" data-ph="1">Une autre phrase</button></section></div>`;
}
function sec(s){
 if(s.t==="text")return `<section class="card"><h2>${s.q}</h2>${ta(s.x,s.ph,60)}</section>`;
 return `<section class="card"><h2>${s.q}</h2><div class="chips">${s.items.map(c=>`<button class="chip" data-k="${s.k}" data-c="${esc(c)}" aria-pressed="${S[s.k].includes(c)}">${c}</button>`).join("")}</div>${s.x?ta(s.x,s.ph):""}</section>`;
}
function recap(){
 const j=(a,t)=>[...a,t].filter(x=>x&&x.trim()).join(" / ");
 return `🎯 MON PLAN DU JOUR J\n\nCe qui met la pression : ${j(S.sit,S.sitT)}\nMon corps : ${j(S.body,S.bodyT)}\nMes pensées : ${j(S.pens,S.pensT)}\nQuand je prends du recul : ${S.rf2}${S.rf3?" · "+S.rf3:""}\nMa préparation : ${j(S.prep,S.prepT)}\n\nAvant (30 min) : ${S.rA}\nJuste avant (2 min) : ${S.rB}\nSi trou noir ou stress qui monte : ${S.rC}\nMon objectif (pas de résultat) : ${S.obj}`;
}
function P(){
 const s=PS[step];let h=`<div class="dots">${PS.map((_,i)=>`<i class="${i<=step?"on":""}"></i>`).join("")}</div>`;
 if(step===0)return h+`<div class="pop"><div class="hero">🧭</div><h1>Mon plan anti-trac</h1><p style="margin-top:12px">Contrôle, oral, scène, match : la pression fait partie du jeu. Le but n’est pas de ne plus stresser, mais de garder la main quand ça monte.</p><p class="sub">Tu repères tes déclencheurs, ton corps, tes pensées, tu prépares ta routine, puis tu t’en sers le jour J. Rien n’est envoyé : tout reste sur ton appareil.</p><div class="nav"><button class="btn" data-tab="c" style="background:var(--c2)">🎯 J’ai un événement, là</button></div></div>${nav("Commencer mon plan")}`;
 if(s.id==="plan")return h+`<div class="pop"><div class="hero">${s.e}</div><h1 style="font-size:1.7rem;margin-bottom:12px">${s.n}</h1>
 <section class="card"><h2>Avant (30 minutes)</h2>${ta("rA","Arriver en avance, musique, marcher, boire de l’eau…",60)}</section>
 <section class="card"><h2>Juste avant (2 minutes)</h2>${ta("rB","Ex : 5 respirations lentes, ma phrase, relâcher les épaules…",60)}</section>
 <section class="card"><h2>Si trou noir ou stress qui monte</h2>${ta("rC","Ex : pause, respiration, regarder mes notes, « je reprends »…",60)}</section>
 <section class="card"><h2>Mon objectif (pas un résultat)</h2><p class="sub">Un objectif que tu contrôles, pas une note ou un classement.</p>${ta("obj","Ex : parler lentement, respirer entre deux parties, aller au bout…",60)}</section>
 <section class="card"><h2>Mon récap</h2><textarea id="recap" readonly style="min-height:240px">${esc(recap())}</textarea><div class="nav"><button class="btn" id="copy" data-src="recap">Copier mon plan</button></div><p class="sub" id="msg" style="margin:8px 0 0"></p></section>
 <p class="note">Faire de son mieux, ce n’est pas être parfait. Si la peur de l’échec te fait éviter des choses, te coupe l’appétit, le sommeil ou l’envie, parles-en à un adulte de confiance, à un prof, à un coach ou à un psychologue : ça se travaille très bien.</p>${calls()}
 <div class="nav"><button class="btn" data-tab="j">📓 Ouvrir mon journal</button></div>
 <div class="nav"><button class="btn ghost" data-go="-1">Retour</button><button class="btn ghost" id="reset">Effacer mon plan</button></div></div>`;
 return h+`<div class="pop"><div class="hero">${s.e}</div><h1 style="font-size:1.7rem;margin-bottom:8px">${s.n}</h1><p class="sub">${s.i}</p>${s.secs.map(sec).join("")}</div>${nav("Suite")}`;
}
const cj=(k,items)=>items.map(c=>`<button class="chip" data-j="${k}" data-c="${esc(c)}" aria-pressed="${cur[k].includes(c)}">${c}</button>`).join("");
const cs=(k,items)=>items.map(c=>`<button class="chip" data-s="${k}" data-c="${esc(c)}" aria-pressed="${cur[k]===c}">${c}</button>`).join("");
function J(){
 const t=iso(new Date());
 const list=Object.keys(S.J).sort().reverse().slice(0,7).map(k=>{const x=S.J[k];return `<div class="row"><span class="e">${W[wi(x.bef)][0]}</span><div class="t"><b>${ld(k)}</b><br><span class="sub">${esc(x.ev||"")} · avant ${x.bef}/10 · pendant ${x.dur}/10${x.feel?" · "+esc(x.feel):""}</span></div><button class="x" data-del="${k}" aria-label="Supprimer le ${ld(k)}">✕</button></div>`}).join("")||`<p class="sub" style="margin:0">Pas encore d’événement noté.</p>`;
 return `<div class="pop"><h1 style="font-size:1.7rem;margin-bottom:6px">📓 Mon journal</h1><p class="sub">Après chaque événement (contrôle, oral, match, concert…), une minute pour comparer le stress prévu et le stress vécu.</p>
 <section class="card"><h2>Quel jour ?</h2><input type="date" id="jdate" value="${jd}" max="${t}" aria-label="Date"><p class="sub" style="margin:8px 0 0">${ld(jd)}</p></section>
 <section class="card"><h2>Quel événement ?</h2><div class="chips">${cs("ev",EV)}</div></section>
 <section class="card slider"><h2>Mon stress avant</h2>${wxs("jb",cur.bef)}<input type="range" id="jb" min="0" max="10" value="${cur.bef}" aria-label="Stress avant de 0 à 10"></section>
 <section class="card slider"><h2>Mon stress pendant</h2>${wxs("jd",cur.dur)}<input type="range" id="jdu" min="0" max="10" value="${cur.dur}" aria-label="Stress pendant de 0 à 10"></section>
 <section class="card"><h2>Comment ça s’est passé</h2><div class="chips">${cs("feel",FE)}</div><h2>Ce que j’ai utilisé</h2><div class="chips">${cj("tried",TOOLS)}</div><textarea id="jn" placeholder="Un truc dont je suis fier ou que j’ai appris…">${esc(cur.note)}</textarea></section>
 <div class="nav"><button class="btn" id="jsave">Enregistrer</button></div><p class="sub" id="jm" style="margin:8px 0 16px"></p>
 <section class="card"><h2>Mes derniers événements</h2>${list}</section></div>`;
}
function E(){
 const es=Object.keys(S.J).sort().slice(-14).map(k=>({d:k,...blank(),...S.J[k]})),n=es.length;
 const h=`<div class="pop"><h1 style="font-size:1.7rem;margin-bottom:6px">📈 Mon suivi</h1>`;
 if(n<2)return h+`<section class="card"><p>Note au moins 2 événements pour voir ta courbe. Tu en as ${n} pour l’instant.</p><div class="nav"><button class="btn" data-tab="j">Aller au journal</button></div></section></div>`;
 const avg=(a,k)=>a.reduce((s,x)=>s+x[k],0)/a.length,ab=avg(es,"bef"),ad=avg(es,"dur");
 const ok=es.filter(e=>e.feel[0]==="😄"||e.feel[0]==="🙂").length,dif=es.slice(-5).filter(e=>e.feel[0]==="😣").length;
 const msg=ad<=ab-.5?"Tu stresses plus avant l’événement que pendant : l’anticipation est souvent pire que la réalité 🌤️":ad>=ab+.5?"Ton stress monte plutôt pendant l’événement. Ta routine et ton plan « trou noir » peuvent t’aider.":"Ton stress avant et pendant est plutôt proche.";
 const cnt=a=>{const o={};a.forEach(c=>o[c]=(o[c]||0)+1);return Object.entries(o).sort((a,b)=>b[1]-a[1]).slice(0,3)};
 const topOk=cnt(es.filter(e=>e.feel[0]==="😄"||e.feel[0]==="🙂").flatMap(e=>e.tried));
 const bars=a=>a.length?a.map(([c,v])=>`<div class="bar"><span>${c}</span><div class="bt"><i style="width:${Math.round(v/Math.max(ok,1)*100)}%"></i></div><b>${v}</b></div>`).join(""):`<p class="sub" style="margin:0">Rien noté pour l’instant.</p>`;
 const Wd=360,H=170,p=28,x=i=>p+i*(Wd-2*p)/(n-1),y=v=>H-26-v*(H-50)/10;
 let sv=`<svg viewBox="0 0 ${Wd} ${H}" style="width:100%;height:auto" role="img" aria-label="Courbes du stress avant et pendant">`;
 [0,5,10].forEach(v=>sv+=`<line x1="${p}" x2="${Wd-p}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-dasharray="3 5"/><text x="2" y="${y(v)+4}" font-size="11" fill="var(--mut)">${v}</text>`);
 [["bef","var(--c1)"],["dur","var(--c2)"]].forEach(([k,c])=>{sv+=`<polyline fill="none" stroke="${c}" stroke-width="3" stroke-linejoin="round" points="${es.map((e,i)=>x(i)+","+y(e[k])).join(" ")}"/>`;es.forEach((e,i)=>sv+=`<circle cx="${x(i)}" cy="${y(e[k])}" r="4.5" fill="${c}"/>`)});
 sv+=`<text x="${p}" y="${H-6}" font-size="11" fill="var(--mut)">${sd(es[0].d)}</text><text x="${Wd-p}" y="${H-6}" font-size="11" fill="var(--mut)" text-anchor="end">${sd(es[n-1].d)}</text></svg>`;
 const txt=`🎯 Bilan sur ${n} événements\nStress moyen avant : ${ab.toFixed(1)}/10 · pendant : ${ad.toFixed(1)}/10\nPassés comme prévu ou mieux : ${ok} sur ${n}\n${msg}\nCe qui m’a aidé : ${topOk.map(a=>a[0]+" ("+a[1]+")").join(", ")}`;
 return h+(dif>=3?`<div class="alert"><b>Plusieurs événements difficiles récemment.</b> Parles-en à un prof, un coach ou un psychologue : l’anxiété de performance se travaille très bien. Tu peux aussi appeler le Fil Santé Jeunes, 0 800 235 236 (9h-23h).</div>`:"")+`<section class="card"><h2>Stress prévu et stress vécu</h2>${sv}<p class="sub" style="margin:8px 0 0"><b style="color:var(--c1)">●</b> avant · <b style="color:var(--c2)">●</b> pendant</p><p style="margin:10px 0 0"><b>${msg}</b></p></section>
 <section class="card"><h2>En un coup d’œil</h2><p style="margin:0">😌 Moyenne avant : ${ab.toFixed(1)}/10 · pendant : ${ad.toFixed(1)}/10<br>🙂 ${ok} événement${ok>1?"s":""} sur ${n} passé${ok>1?"s":""} comme prévu ou mieux</p></section>
 <section class="card"><h2>Ce qui m’a aidé quand ça s’est bien passé</h2>${bars(topOk)}</section>
 <section class="card"><h2>Mon bilan à partager</h2><textarea id="bilan" readonly style="min-height:130px">${esc(txt)}</textarea><div class="nav"><button class="btn" id="copy" data-src="bilan">Copier mon bilan</button></div><p class="sub" id="msg" style="margin:8px 0 0">Montre-le à un prof, un coach ou un psy : il aide à cibler le bon soutien.</p></section>
 <div class="nav"><button class="btn" data-tab="j">📓 Ajouter un événement</button><button class="btn ghost" id="jreset">Effacer le journal</button></div></div>`;
}
function render(keep){
 stopB();$("#app").style.setProperty("--z",tab==="p"?(PS[step].c||"var(--c1)"):"var(--c1)");
 $("#app").innerHTML=tabs()+(tab==="c"?C0():tab==="p"?P():tab==="j"?J():E());if(!keep)window.scrollTo(0,0);
}
function startB(){
 stopB();const o=$("#orb"),m=$("#bmsg"),b=$("#bstart");let n=0;b.textContent="Arrêter";b.dataset.on="1";
 const cyc=()=>{
  m.textContent=`Cycle ${n+1} · Inspire par le nez… (4 s)`;o.style.transition="transform 4s ease-in-out";o.style.transform="scale(1)";
  bt.push(setTimeout(()=>{m.textContent=`Cycle ${n+1} · Souffle doucement par la bouche… (6 s)`;o.style.transition="transform 6s ease-in-out";o.style.transform="scale(.6)"},4000));
  bt.push(setTimeout(()=>{n++;cyc()},10000));
 };cyc();
}
const toggle=(a,c)=>{const i=a.indexOf(c);if(i>=0)a.splice(i,1);else a.push(c);return i<0};
document.addEventListener("click",e=>{
 const t=e.target.closest("button");if(!t)return;
 if(t.dataset.tab){tab=t.dataset.tab;render();return}
 if(t.dataset.m){md=t.dataset.m;pi=0;render(true);return}
 if(t.dataset.go){step=Math.max(0,Math.min(PS.length-1,step+ +t.dataset.go));render();return}
 if(t.dataset.k){t.setAttribute("aria-pressed",toggle(S[t.dataset.k],t.dataset.c));save();return}
 if(t.dataset.j){t.setAttribute("aria-pressed",toggle(cur[t.dataset.j],t.dataset.c));return}
 if(t.dataset.s){const k=t.dataset.s,was=cur[k]===t.dataset.c;cur[k]=was?"":t.dataset.c;document.querySelectorAll(`[data-s="${k}"]`).forEach(b=>b.setAttribute("aria-pressed",cur[k]===b.dataset.c));return}
 if(t.dataset.ph){pi++;$("#ph").textContent=PH[md][pi%PH[md].length];return}
 if(t.dataset.del){delete S.J[t.dataset.del];save();load();render(true);return}
 if(t.id==="bstart"){if(t.dataset.on){stopB();render(true)}else startB();return}
 if(t.id==="jsave"){S.J[jd]=JSON.parse(JSON.stringify(cur));save();render(true);$("#jm").textContent="Enregistré ✅ Bravo d’avoir pris ce temps pour toi.";return}
 if(t.id==="copy"){const r=$("#"+t.dataset.src),m=$("#msg"),f=()=>{r.select();m.textContent="Sélectionné : copie-le à la main."};
  try{navigator.clipboard.writeText(r.value).then(()=>m.textContent="Copié ✅",f)}catch(x){f()}return}
 if(t.id==="reset"&&confirm("Effacer ton plan (le journal est conservé) ?")){KA.forEach(k=>S[k]=[]);KT.forEach(k=>S[k]="");save();step=0;render()}
 if(t.id==="jreset"&&confirm("Effacer tout ton journal ?")){S.J={};save();load();render()}
});
document.addEventListener("input",e=>{
 const t=e.target;
 if(t.dataset&&t.dataset.x){S[t.dataset.x]=t.value;save();const r=$("#recap");if(r)r.value=recap()}
 const upd=(id,v)=>{const w=W[wi(v)];$("#"+id+"X").textContent=w[0];$("#"+id+"L").textContent=w[1]+" · "+v+"/10"};
 if(t.id==="jb"){cur.bef=+t.value;upd("jb",cur.bef)}
 if(t.id==="jdu"){cur.dur=+t.value;upd("jd",cur.dur)}
 if(t.id==="jn")cur.note=t.value;
 if(t.id==="jdate"){jd=t.value||iso(new Date());load();render(true)}
});
render();
</script>
</body>
</html>
