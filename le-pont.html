function recap(){
 const d=D(),r=RR(),j=(a,t)=>[...a,t].filter(x=>x&&x.trim()).join(" / ");
 return `🌉 MON PLAN POUR AMÉLIORER LA RELATION (${S.role==="ado"?"côté ado":"côté parent"})\n\nCe qui va bien : ${j(d.like,d.likeT)}\nCe qui pèse : ${j(d.weigh,d.weighT)}\nMes besoins : ${j(d.need,d.needT)}\nQuand ça chauffe, je : ${j(d.react,d.reactT)}\n\nMon message en « je » : ${mjp()}\nJe veux essayer d’écouter ainsi : ${j(d.listen,d.lsT)}\nCompromis à proposer (${d.ng1}) : ${d.ng4}\nPetits moments positifs : ${j(d.pos,d.posT)}\n\n✅ Mon engagement cette semaine : ${d.e1}\n💬 La phrase que je veux dire : ${d.e2}\n🙏 Ce que je demande à ${r.jtalk} : ${d.e3}`;
}
function P(){
 const ST=steps(),s=ST[step],r=RR();let h=`<div class="dots">${ST.map((_,i)=>`<i class="${i<=step?"on":""}"></i>`).join("")}</div>`;
 if(step===0)return h+`<div class="pop"><div class="hero">🌉</div><h1>Le pont</h1><p style="margin-top:12px">Entre un parent et un ado, les disputes viennent souvent de besoins qui ne se rencontrent pas, pas d’un manque d’amour. Ici, chacun fait le point de son côté, puis construit des gestes concrets pour se rapprocher.</p><p class="sub">Choisis ton rôle en haut (ado ou parent). Chacun a sa propre version, avec ses propres réponses. Idéalement, remplissez-la chacun de votre côté, puis comparez. Rien n’est envoyé : tout reste sur ton appareil.</p><div class="nav"><button class="btn" data-tab="c" style="background:var(--c2)">🧯 Il y a une dispute, là</button></div></div>${nav("Commencer")}`;
 if(s.id==="final")return h+`<div class="pop"><div class="hero">${s.e}</div><h1 style="font-size:1.7rem;margin-bottom:12px">${s.n}</h1>
 <section class="card"><h2>${r.commit}</h2>${ta("e1","Un geste concret, petit et réaliste…",60)}</section>
 <section class="card"><h2>La phrase que je veux dire</h2>${ta("e2","Ex : « Je voudrais qu’on se parle plus calmement. »",60)}</section>
 <section class="card"><h2>${r.ask}</h2>${ta("e3","Une chose précise, faisable…",60)}</section>
 <section class="card"><h2>Mon récap</h2><textarea id="recap" readonly style="min-height:240px">${esc(recap())}</textarea><div class="nav"><button class="btn" id="copy" data-src="recap">Copier mon plan</button></div><p class="sub" id="msg" style="margin:8px 0 0">Tu peux le montrer à l’autre, en proposant de comparer vos deux versions.</p></section>
 <p class="note">Si la relation est très tendue depuis longtemps, une médiation familiale ou un psychologue peut aider : il n’est pas nécessaire que ce soit « grave » pour y aller. Si une personne a peur, est menacée ou frappée, appelle le 119.</p>${calls()}
 <div class="nav"><button class="btn" data-tab="j">📓 Ouvrir mon journal</button></div>
 <div class="nav"><button class="btn ghost" data-go="-1">Retour</button><button class="btn ghost" id="reset">Effacer mon plan</button></div></div>`;
 return h+`<div class="pop"><div class="hero">${s.e}</div><h1 style="font-size:1.7rem;margin-bottom:8px">${s.n}</h1><p class="sub">${s.i}</p>${s.secs.map(sec).join("")}</div>${nav("Suite")}`;
}
const cj=(k,items)=>items.map(c=>`<button class="chip" data-j="${k}" data-c="${esc(c)}" aria-pressed="${cur[k].includes(c)}">${c}</button>`).join("");
const cs=(k,items)=>items.map(c=>`<button class="chip" data-s="${k}" data-c="${esc(c)}" aria-pressed="${cur[k]===c}">${c}</button>`).join("");
function J(){
 const t=iso(new Date()),r=RR();
 const list=Object.keys(JJ()).sort().reverse().slice(0,7).map(k=>{const x=JJ()[k];return `<div class="row"><span class="e">${W[wi(x.amb)][0]}</span><div class="t"><b>${ld(k)}</b> · ${x.amb}/10<br><span class="sub">${esc(x.dis||"")}${x.jg?" — "+esc(x.jg.slice(0,60)):""}</span></div><button class="x" data-del="${k}" aria-label="Supprimer le ${ld(k)}">✕</button></div>`}).join("")||`<p class="sub" style="margin:0">Pas encore de jour noté.</p>`;
 return `<div class="pop"><h1 style="font-size:1.7rem;margin-bottom:6px">📓 Mon journal</h1><p class="sub">Une minute par jour pour voir comment l’ambiance avec ${r.it} évolue, et ce qui marche vraiment.</p>
 <section class="card"><h2>Quel jour ?</h2><input type="date" id="jdate" value="${jd}" max="${t}" aria-label="Date"><p class="sub" style="margin:8px 0 0">${ld(jd)}</p></section>
 <section class="card slider"><h2>L’ambiance entre nous</h2>${wxs("ja",cur.amb)}<input type="range" id="ja" min="0" max="10" value="${cur.amb}" aria-label="Ambiance de 0 à 10"><p class="sub" style="margin:0">0 = très tendue · 10 = très bonne</p></section>
 <section class="card"><h2>Un moment positif aujourd’hui</h2><textarea id="jg" placeholder="Même tout petit : un sourire, un repas, un mot gentil…">${esc(cur.jg)}</textarea></section>
 <section class="card"><h2>Y a-t-il eu une tension ?</h2><div class="chips">${cs("dis",DS)}</div><h2>Comment ça s’est géré</h2><div class="chips">${cs("ges",GS)}</div><h2>Ce que j’ai essayé</h2><div class="chips">${cj("tried",TOOLS)}</div></section>
 <div class="nav"><button class="btn" id="jsave">Enregistrer cette journée</button></div><p class="sub" id="jm" style="margin:8px 0 16px"></p>
 <section class="card"><h2>Mes derniers jours</h2>${list}</section></div>`;
}
function E(){
 const r=RR(),es=Object.keys(JJ()).sort().slice(-14).map(k=>({d:k,...blank(),...JJ()[k]})),n=es.length;
 const h=`<div class="pop"><h1 style="font-size:1.7rem;margin-bottom:6px">📈 Mon suivi</h1>`;
 if(n<2)return h+`<section class="card"><p>Note au moins 2 jours dans ton journal pour voir ta courbe. Tu en as ${n} pour l’instant.</p><div class="nav"><button class="btn" data-tab="j">Aller au journal</button></div></section></div>`;
 const avg=a=>a.reduce((s,x)=>s+x.amb,0)/a.length,m=Math.floor(n/2);
 const tr=n<4?"":(d=>d>=1?"Sur la période, l’ambiance s’est plutôt améliorée 🌤️ Repère ce qui a aidé.":d<=-1?"Sur la période, l’ambiance est plutôt devenue plus tendue. Ce n’est pas un échec : un tiers (médiation, psy) peut aider.":"Sur la période, l’ambiance est plutôt stable.")(avg(es.slice(m))-avg(es.slice(0,m)));
 const dsp=es.filter(e=>e.dis[0]==="⛈").length,ten=es.filter(e=>e.dis[0]==="🌦").length,rep=es.filter(e=>e.dis[0]!=="🌤"&&e.dis&&e.ges[0]==="✅").length,tot=dsp+ten,pos=es.filter(e=>e.jg.trim()).length;
 const cnt=a=>{const o={};a.forEach(c=>o[c]=(o[c]||0)+1);return Object.entries(o).sort((a,b)=>b[1]-a[1]).slice(0,3)};
 const good=es.filter(e=>e.amb>=6||e.ges[0]==="✅"||e.ges[0]==="🔸"),topOk=cnt(good.flatMap(e=>e.tried));
 const bars=a=>a.length?a.map(([c,v])=>`<div class="bar"><span>${c}</span><div class="bt"><i style="width:${Math.round(v/Math.max(good.length,1)*100)}%"></i></div><b>${v}</b></div>`).join(""):`<p class="sub" style="margin:0">Rien noté pour l’instant.</p>`;
 const Wd=360,H=170,p=28,x=i=>p+i*(Wd-2*p)/(n-1),y=v=>H-26-v*(H-50)/10;
 let sv=`<svg viewBox="0 0 ${Wd} ${H}" style="width:100%;height:auto" role="img" aria-label="Courbe de l’ambiance">`;
 [0,5,10].forEach(v=>sv+=`<line x1="${p}" x2="${Wd-p}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-dasharray="3 5"/><text x="2" y="${y(v)+4}" font-size="11" fill="var(--mut)">${v}</text>`);
 sv+=`<polyline fill="none" stroke="var(--z)" stroke-width="3" stroke-linejoin="round" points="${es.map((e,i)=>x(i)+","+y(e.amb)).join(" ")}"/>`;
 es.forEach((e,i)=>sv+=`<circle cx="${x(i)}" cy="${y(e.amb)}" r="5" fill="${e.dis[0]==="⛈"?"var(--c2)":"var(--z)"}"/>`);
 sv+=`<text x="${p}" y="${H-6}" font-size="11" fill="var(--mut)">${sd(es[0].d)}</text><text x="${Wd-p}" y="${H-6}" font-size="11" fill="var(--mut)" text-anchor="end">${sd(es[n-1].d)}</text></svg>`;
 const warn=es.slice(-5).filter(e=>e.dis[0]==="⛈").length>=3&&avg(es.slice(-5))<=3;
 const txt=`🌉 Bilan sur ${n} jours (${S.role==="ado"?"côté ado":"côté parent"})\nAmbiance moyenne : ${avg(es).toFixed(1)}/10\nJours de dispute : ${dsp} · petites tensions : ${ten}${tot?` · réparées : ${rep}`:""}\nJours avec un moment positif noté : ${pos}\n${tr}\nCe qui a aidé : ${topOk.map(a=>a[0]+" ("+a[1]+")").join(", ")}`;
 return h+(warn?`<div class="alert"><b>Les disputes sont fréquentes en ce moment.</b> Parler à un tiers peut vraiment aider : médiation familiale, psychologue, ou une ligne d’écoute. Parents : Allô, parents en crise, 0 805 382 300. Ados : Fil Santé Jeunes, 0 800 235 236.</div>`:"")+`<section class="card"><h2>L’ambiance entre nous</h2>${sv}<p class="sub" style="margin:8px 0 0">Points rouges = jours de dispute.</p>${tr?`<p style="margin:10px 0 0"><b>${tr}</b></p>`:""}</section>
 <section class="card"><h2>En un coup d’œil</h2><p style="margin:0">⛈️ ${dsp} jour${dsp>1?"s":""} de dispute · 🌦️ ${ten} petite${ten>1?"s":""} tension${ten>1?"s":""}<br>🙏 ${rep} réparée${rep>1?"s":""} sur ${tot}<br>🌞 ${pos} jour${pos>1?"s":""} avec un moment positif noté</p></section>
 <section class="card"><h2>Ce qui aide dans les bons jours</h2>${bars(topOk)}</section>
 <section class="card"><h2>Mon bilan à partager</h2><textarea id="bilan" readonly style="min-height:130px">${esc(txt)}</textarea><div class="nav"><button class="btn" id="copy" data-src="bilan">Copier mon bilan</button></div><p class="sub" id="msg" style="margin:8px 0 0">À partager si tu le souhaites : il peut servir de base de discussion, ou à un professionnel pour comprendre la situation.</p></section>
 <div class="nav"><button class="btn" data-tab="j">📓 Ajouter un jour</button><button class="btn ghost" id="jreset">Effacer le journal</button></div></div>`;
}
function render(keep){
 stopB();const st=steps();$("#app").style.setProperty("--z",tab==="p"?(st[step].c||"var(--c1)"):"var(--c1)");
 $("#app").innerHTML=head()+(tab==="c"?C0():tab==="p"?P():tab==="j"?J():E());if(!keep)window.scrollTo(0,0);
}
function startB(){
 stopB();const o=$("#orb"),m=$("#bmsg"),b=$("#bstart");let n=0;b.textContent="Arrêter";b.dataset.on="1";
 const cyc=()=>{
  m.textContent=`Cycle ${n+1} · Inspire par le nez… (4 s)`;o.style.transition="transform 4s ease-in-out";o.style.transform="scale(1)";
  bt.push(setTimeout(()=>{m.textContent=`Cycle ${n+1} · Souffle doucement par la bouche… (6 s)`;o.style.transition="transform 6s ease-in-out";o.style.transform="scale(.6)"},4000));
  bt.push(setTimeout(()=>{n++;cyc()},10000));
 };cyc();
}
const toggle=(a,c)=>{const i=a.indexOf(c);if(i>=0)a.splice(i,1);else a.push(c);return i<0};
document.addEventListener("click",e=>{
 const t=e.target.closest("button");if(!t)return;
 if(t.dataset.role){S.role=t.dataset.role;save();load();pi=0;render(true);return}
 if(t.dataset.tab){tab=t.dataset.tab;render();return}
 if(t.dataset.m){md=t.dataset.m;pi=0;render(true);return}
 if(t.dataset.go){step=Math.max(0,Math.min(steps().length-1,step+ +t.dataset.go));render();return}
 if(t.dataset.k){t.setAttribute("aria-pressed",toggle(D()[t.dataset.k],t.dataset.c));save();return}
 if(t.dataset.j){t.setAttribute("aria-pressed",toggle(cur[t.dataset.j],t.dataset.c));return}
 if(t.dataset.s){const k=t.dataset.s,was=cur[k]===t.dataset.c;cur[k]=was?"":t.dataset.c;document.querySelectorAll(`[data-s="${k}"]`).forEach(b=>b.setAttribute("aria-pressed",cur[k]===b.dataset.c));return}
 if(t.dataset.ph){pi++;const a=RR().selft;$("#ph").textContent=a[pi%a.length];return}
 if(t.dataset.del){delete JJ()[t.dataset.del];save();load();render(true);return}
 if(t.id==="bstart"){if(t.dataset.on){stopB();render(true)}else startB();return}
 if(t.id==="jsave"){JJ()[jd]=JSON.parse(JSON.stringify(cur));save();render(true);$("#jm").textContent="Enregistré ✅ Merci d’avoir pris ce temps.";return}
 if(t.id==="copy"){const r=$("#"+t.dataset.src),m=$("#msg"),f=()=>{r.select();m.textContent="Sélectionné : copie-le à la main."};
  try{navigator.clipboard.writeText(r.value).then(()=>m.textContent="Copié ✅",f)}catch(x){f()}return}
 if(t.id==="reset"&&confirm("Effacer ton plan (le journal est conservé) ?")){const o=D();KA.forEach(k=>o[k]=[]);KT.forEach(k=>o[k]="");save();step=0;render()}
 if(t.id==="jreset"&&confirm("Effacer tout ton journal ?")){S.J[S.role]={};save();load();render()}
});
document.addEventListener("input",e=>{
 const t=e.target;
 if(t.dataset&&t.dataset.x){D()[t.dataset.x]=t.value;save();const r=$("#recap");if(r)r.value=recap();const q=$("#mjp");if(q)q.textContent=mjp()}
 if(t.id==="ja"){cur.amb=+t.value;const w=W[wi(cur.amb)];$("#jaX").textContent=w[0];$("#jaL").textContent=w[1]+" · "+cur.amb+"/10"}
 if(t.id==="jg")cur.jg=t.value;
 if(t.id==="jdate"){jd=t.value||iso(new Date());load();render(true)}
});
render();
</script>
