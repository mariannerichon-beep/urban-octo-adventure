<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mon radar</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6F2FF;--ink:#241B4B;--card:#FFFFFF;--mut:#6A5F94;--line:#DCD3FF;--c1:#7B5CFF;--c2:#E8456B;--c3:#B86E00;--c4:#0E9F8E;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16123A;--ink:#F3EFFF;--card:#231D56;--mut:#B2A8E6;--line:#3A3290;--c1:#A99BFF;--c2:#FF7C9B;--c3:#FFC83D;--c4:#4FE3CF}}
:root[data-theme="dark"]{--bg:#16123A;--ink:#F3EFFF;--card:#231D56;--mut:#B2A8E6;--line:#3A3290;--c1:#A99BFF;--c2:#FF7C9B;--c3:#FFC83D;--c4:#4FE3CF}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Nunito",system-ui,sans-serif;font-weight:500;font-size:17px;line-height:1.5}
main{max-width:560px;margin:0 auto;padding:16px 18px 40px}
h1,h2,h3{font-family:"Fredoka","Nunito",system-ui,sans-serif;font-weight:600;line-height:1.15;margin:0}
h1{font-size:2.4rem}
h2{font-size:1.25rem;margin-bottom:10px}
p{margin:0 0 12px}
.dots{display:flex;gap:8px;margin:6px 0 22px}
.dots i{flex:1;height:8px;border-radius:8px;background:var(--line)}
.dots i.on{background:var(--z,var(--c1))}
.hero{font-size:4.2rem;line-height:1;margin:6px 0 10px}
.card{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:18px;margin-bottom:16px}
.zone{--z:var(--c1)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{font:inherit;font-weight:700;font-size:.95rem;color:var(--ink);background:transparent;border:2px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--z);border-color:var(--z);color:#fff}
:root:not([data-theme="light"]) .chip[aria-pressed="true"]{color:#1A1440}
@media (prefers-color-scheme:light){.chip[aria-pressed="true"]{color:#fff}}
textarea,input[type=text]{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:16px;padding:12px 14px;resize:vertical}
textarea{min-height:76px}
textarea:focus,input:focus,.chip:focus-visible,.btn:focus-visible{outline:3px solid var(--z,var(--c1));outline-offset:2px}
.nav{display:flex;gap:12px;margin-top:8px}
.btn{font:inherit;font-family:"Fredoka",sans-serif;font-weight:600;font-size:1.05rem;border:0;border-radius:999px;padding:14px 22px;cursor:pointer;background:var(--z,var(--c1));color:#fff;flex:1}
:root:not([data-theme="light"]) .btn{color:#1A1440}
@media (prefers-color-scheme:light){.btn{color:#fff}}
.btn.ghost{background:transparent;color:var(--ink)!important;border:2px solid var(--line);flex:0 0 auto}
.sub{color:var(--mut)}
.map{width:100%;height:auto;display:block;border-radius:22px;background:var(--card);border:2px solid var(--line);margin-bottom:16px}
.map text{font-family:"Fredoka",sans-serif}
.note{font-size:.92rem;color:var(--mut);border-left:4px solid var(--c4);padding-left:12px;margin:18px 0}
@media (prefers-reduced-motion:no-preference){.pop{animation:pop .35s ease-out}@keyframes pop{from{transform:scale(.96);opacity:.4}to{transform:none;opacity:1}}}
</style>
</head>
<body>
<main id="app"></main>
<script>
const Z=[
{k:"moi",e:"🪐",n:"Moi",c:"var(--c1)",
 plus:["😂 Je fais rire","💪 Je ne lâche pas","🎨 Créatif","🦁 Courageux","👂 Je sais écouter","🔍 Curieux","❤️ Généreux","🎮 Doué dans un domaine"],
 minus:["⏰ Je remets à plus tard","🌋 Je m’énerve vite","🫥 Je doute de moi","🐢 Timide","🪞 Je me compare aux autres","📱 Trop sur mon téléphone","🤐 Je garde tout pour moi","😴 Je dors mal"],
 q:["Mes super-pouvoirs","Mes kryptonites","Si j’avais une baguette magique 🪄","Mon petit pas de la semaine 👣"],
 ph:["Un truc dont je suis fier…","Ce qui me complique la vie…","Chez moi, je changerais…","Un petit truc que je peux essayer…"]},
{k:"fam",e:"🏠",n:"Ma famille",c:"var(--c2)",
 plus:["😄 On rigole ensemble","🤗 Je me sens soutenu","🍝 Les moments à table","🔑 On me fait confiance","🗣️ On se parle vraiment","🏖️ Nos habitudes à nous"],
 minus:["⚡ On se dispute souvent","⌛ Pas assez de temps ensemble","🏋️ Trop de pression","🙉 Je ne me sens pas écouté","📏 Trop de règles","📱 Les règles sur le téléphone","🦅 Pas assez de liberté"],
 q:["Ce que j’aime chez eux","Ce qui est dur","Si j’avais une baguette magique 🪄","Ce que je pourrais tenter de mon côté 👣"],
 ph:["Un souvenir ou un truc qui me rend heureux…","Ce que j’aimerais qu’ils comprennent…","Dans ma famille, je changerais…","Une phrase que j’aimerais leur dire…"]},
{k:"amis",e:"🎈",n:"Amis et réseaux",c:"var(--c4)",
 plus:["🤝 Ils sont loyaux","😂 On rit pour tout","🛟 Ils sont là quand ça va mal","🎮 On a nos délires","🧠 On se comprend","🌟 Ils me tirent vers le haut"],
 minus:["🎭 Je n’ose pas être moi","👀 La pression du groupe","💬 Messages, groupes et non-dits","🥀 Une amitié qui s’éloigne","🏷️ Rumeurs et moqueries","🪑 Je me sens parfois à part","💘 Les histoires de cœur"],
 q:["Ce que j’aime chez eux","Ce qui est compliqué","Si j’avais une baguette magique 🪄","Ce que je pourrais tenter de mon côté 👣"],
 ph:["Ce que mes amis m’apportent…","Ce qui me pèse parfois…","Dans mon groupe, je changerais…","Un message ou un geste que je pourrais faire…"]},
{k:"ecole",e:"🎒",n:"École et avenir",c:"var(--c3)",
 plus:["📚 Des matières que j’aime","🏆 Je réussis dans un domaine","👩‍🏫 Un prof m’inspire","🎯 J’ai des rêves","🎭 Mes activités hors cours","🤝 Je me sens bien dans ma classe"],
 minus:["😴 Dur de me motiver","📝 Le stress des contrôles","📚 Trop de devoirs","🌫️ Je ne sais pas quoi faire plus tard","🙋 Je n’ose pas participer","😬 Moqueries ou harcèlement","🏫 Je ne me sens pas à ma place"],
 q:["Ce qui marche pour moi","Ce qui est difficile","Si j’avais une baguette magique 🪄","Mon petit pas vers mon avenir 👣"],
 ph:["Une matière, un moment, une réussite…","Ce qui me stresse ou m’ennuie…","À l’école ou pour mon avenir, je changerais…","Demander de l’aide, m’organiser, découvrir un métier…"]}
];
let S=null,step=0;
try{S=JSON.parse(localStorage.getItem("ado_radar_13_15")||"null")}catch(e){}
S=S||{};
Z.forEach(z=>{S[z.k]=S[z.k]||{plus:[],minus:[],t:["","","",""]}});
S.mission=S.mission||"";
const save=()=>{try{localStorage.setItem("ado_radar_13_15",JSON.stringify(S))}catch(e){}};
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
const $=s=>document.querySelector(s);

function dots(){return `<div class="dots" style="--z:${step?Z[Math.min(step,Z.length)-1].c:"var(--c1)"}">${[0,1,2,3,4,5].map(i=>`<i class="${i<=step?"on":""}"></i>`).join("")}</div>`}
function nav(next,label){return `<div class="nav">${step?`<button class="btn ghost" data-go="-1">Retour</button>`:""}<button class="btn" data-go="1">${label}</button></div>`}

function render(){
 let h="";
 if(step===0){
  h=`${dots()}<div class="pop"><div class="hero">🛰️🪐</div><h1>Mon radar</h1>
  <p style="margin-top:12px">Quatre planètes : toi, ta famille, tes amis, l’école et l’avenir. Sur chacune, tu notes ce qui brille, ce qui coince, et ce que tu changerais.</p>
  <p class="sub">Pas de bonne ou de mauvaise réponse. Touche les bulles qui te ressemblent, écris si tu veux, saute ce que tu n’as pas envie de remplir. Rien n’est envoyé : tout reste sur ton appareil.</p></div>${nav(1,"C’est parti")}`;
 } else if(step<=Z.length){
  const z=Z[step-1],d=S[z.k];
  h=`${dots()}<div class="zone pop" style="--z:${z.c}"><div class="hero" style="font-size:3rem">${z.e}</div><h1 style="font-size:1.9rem;margin-bottom:16px">${z.n}</h1>`;
  [0,1,2,3].forEach(i=>{
   const key=["plus","minus"][i];
   h+=`<section class="card"><h2>${z.q[i]}</h2>`;
   if(key)h+=`<div class="chips">${z[key].map((c,j)=>`<button class="chip" data-k="${key}" data-c="${esc(c)}" aria-pressed="${d[key].includes(c)}">${c}</button>`).join("")}</div>`;
   h+=`<textarea data-t="${i}" placeholder="${z.ph[i]}">${esc(d.t[i])}</textarea></section>`;
  });
  h+=`</div>${nav(1,step<Z.length?"Planète suivante":"Voir ma carte")}`;
 } else {
  h=`${dots()}<div class="pop"><h1 style="margin-bottom:6px">Ma carte</h1><p class="sub">Chaque étoile, c’est un truc que tu as noté. ⭐ ce qui brille · 🔸 ce qui coince · ✨ ce que tu veux changer</p>${mapSvg()}`;
  h+=`<section class="card"><h2>Ma mission de la semaine</h2><p class="sub">Choisis un seul petit truc, facile à tenir.</p><input type="text" id="mission" value="${esc(S.mission)}" placeholder="Cette semaine, j’essaie de…"></section>`;
  h+=`<section class="card"><h2>Mon récap</h2><textarea id="recap" readonly style="min-height:160px">${esc(recap())}</textarea><div class="nav"><button class="btn" id="copy">Copier mon récap</button></div><p class="sub" id="msg" style="margin:8px 0 0"></p></section>
  <p class="sub">Tu peux t’en servir pour lancer une discussion avec quelqu’un en qui tu as confiance : un parent, un ami, un prof, l’infirmier scolaire ou le CPE.</p>
  <p class="note">Si un sujet te pèse vraiment, parles-en à un adulte de confiance. En France : le 3114 (détresse, 24h/24), le 119 (enfance en danger) et le 3018 (harcèlement et cyberharcèlement) sont gratuits.</p>
  <div class="nav"><button class="btn ghost" data-go="-1">Retour</button><button class="btn ghost" id="reset">Tout effacer</button></div></div>`;
 }
 $("#app").innerHTML=h;window.scrollTo(0,0);
}

function mapSvg(){
 const pos={moi:[80,85],fam:[280,85],amis:[80,225],ecole:[280,225]};
 let s=`<svg class="map" viewBox="0 0 360 320" role="img" aria-label="Carte de mon radar"><g stroke="var(--line)" stroke-width="2" stroke-dasharray="4 6" fill="none"><path d="M80 85L280 85L280 225L80 225Z"/></g>`;
 Z.forEach(z=>{
  const [x,y]=pos[z.k],d=S[z.k];
  const st=[];
  d.plus.forEach(()=>st.push("⭐"));d.minus.forEach(()=>st.push("🔸"));
  if(d.t[0].trim())st.push("⭐");if(d.t[1].trim())st.push("🔸");if(d.t[2].trim())st.push("✨");if(d.t[3].trim())st.push("✨");
  s+=`<circle cx="${x}" cy="${y}" r="26" fill="${z.c}" opacity=".25"/><text x="${x}" y="${y+10}" font-size="30" text-anchor="middle">${z.e}</text>`;
  st.forEach((t,i)=>{const a=(i*47)*Math.PI/180,r=40+(i%3)*9;s+=`<text x="${(x+Math.cos(a)*r).toFixed(1)}" y="${(y+5+Math.sin(a)*r).toFixed(1)}" font-size="13" text-anchor="middle">${t}</text>`});
  s+=`<text x="${x}" y="${y+72}" font-size="14" text-anchor="middle" fill="var(--ink)">${z.n}</text>`;
 });
 return s+"</svg>";
}

function recap(){
 const L=["Ce qui brille","Ce qui coince","Ma baguette magique","Mon petit pas"];
 let o=Z.map(z=>{const d=S[z.k];let r=z.e+" "+z.n.toUpperCase()+"\n";
  r+="Ce qui brille : "+[...d.plus,d.t[0]].filter(x=>x&&x.trim()).join(" / ")+"\n";
  r+="Ce qui coince : "+[...d.minus,d.t[1]].filter(x=>x&&x.trim()).join(" / ")+"\n";
  r+="Je changerais : "+(d.t[2]||"")+"\n";
  r+="Mon petit pas : "+(d.t[3]||"");return r}).join("\n\n");
 return o+"\n\n🎯 Ma mission : "+S.mission;
}

document.addEventListener("click",e=>{
 const t=e.target.closest("button");if(!t)return;
 if(t.dataset.go){step=Math.max(0,Math.min(Z.length+1,step+ +t.dataset.go));render();return}
 if(t.classList.contains("chip")){
  const z=Z[step-1],arr=S[z.k][t.dataset.k],c=t.dataset.c,i=arr.indexOf(c);
  if(i>=0)arr.splice(i,1);else arr.push(c);
  t.setAttribute("aria-pressed",i<0);save();return}
 if(t.id==="copy"){
  const ta=$("#recap"),m=$("#msg");
  try{navigator.clipboard.writeText(ta.value).then(()=>m.textContent="Copié ✅",()=>{ta.select();m.textContent="Sélectionné : copie-le à la main."})}
  catch(x){ta.select();m.textContent="Sélectionné : copie-le à la main."}return}
 if(t.id==="reset"){
  if(confirm("Tout effacer et recommencer ?")){Z.forEach(z=>{S[z.k]={plus:[],minus:[],t:["","","",""]}});S.mission="";save();step=0;render()}}
});
document.addEventListener("input",e=>{
 const t=e.target;
 if(t.dataset&&t.dataset.t!==undefined){S[Z[step-1].k].t[+t.dataset.t]=t.value;save()}
 if(t.id==="mission"){S.mission=t.value;save();const r=$("#recap");if(r)r.value=recap()}
});
render();
</script>
</body>
</html>
