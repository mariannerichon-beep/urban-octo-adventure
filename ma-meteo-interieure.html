<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ma météo intérieure</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Nunito:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F1F6FF;--ink:#12263F;--card:#FFFFFF;--mut:#53688A;--line:#CFDDF5;--c1:#2F6BDB;--c2:#D9467A;--c3:#B86E00;--c4:#0E8F83;--on:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0C1626;--ink:#EAF2FF;--card:#152238;--mut:#9FB3D6;--line:#27395A;--c1:#7FA8FF;--c2:#FF86AE;--c3:#FFC83D;--c4:#4FE3CF;--on:#0C1626}}
:root[data-theme="dark"]{--bg:#0C1626;--ink:#EAF2FF;--card:#152238;--mut:#9FB3D6;--line:#27395A;--c1:#7FA8FF;--c2:#FF86AE;--c3:#FFC83D;--c4:#4FE3CF;--on:#0C1626}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Nunito",system-ui,sans-serif;font-weight:500;font-size:17px;line-height:1.5}
main{max-width:560px;margin:0 auto;padding:16px 18px 40px;--z:var(--c1)}
h1,h2{font-family:"Baloo 2","Nunito",system-ui,sans-serif;font-weight:700;line-height:1.15;margin:0}
h1{font-size:2.3rem}
h2{font-size:1.2rem;margin-bottom:10px}
p{margin:0 0 12px}
.sub{color:var(--mut)}
.dots{display:flex;gap:6px;margin:6px 0 22px}
.dots i{flex:1;height:8px;border-radius:8px;background:var(--line)}
.dots i.on{background:var(--z)}
.hero{font-size:3.4rem;line-height:1;margin:4px 0 10px}
.card{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:18px;margin-bottom:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{font:inherit;font-weight:700;font-size:.95rem;color:var(--ink);background:transparent;border:2px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--z);border-color:var(--z);color:var(--on)}
textarea,input[type=text]{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:16px;padding:12px 14px;resize:vertical}
textarea{min-height:76px}
textarea:focus,.chip:focus-visible,.btn:focus-visible,input:focus-visible{outline:3px solid var(--z);outline-offset:2px}
.nav{display:flex;gap:12px;margin-top:8px}
.btn{font:inherit;font-family:"Baloo 2",sans-serif;font-weight:700;font-size:1.05rem;border:0;border-radius:999px;padding:12px 22px;cursor:pointer;background:var(--z);color:var(--on);flex:1}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line);flex:0 0 auto}
.slider{text-align:center}
.slider .wx{font-size:3.2rem;line-height:1.1}
.slider .lab{font-family:"Baloo 2",sans-serif;font-weight:700;font-size:1.15rem}
input[type=range]{width:100%;accent-color:var(--z);margin:10px 0 4px}
.alert{background:var(--bg);border:2px solid var(--c2);border-radius:16px;padding:12px 14px;margin-top:10px;text-align:left;font-size:.95rem}
.stage{display:flex;flex-direction:column;align-items:center;padding:10px 0}
.orb{width:180px;height:180px;border-radius:50%;background:var(--z);opacity:.85;transform:scale(.6);display:flex;align-items:center;justify-content:center;font-size:3rem}
.bmsg{margin:16px 0 14px;min-height:3em;text-align:center;font-weight:700}
.note{font-size:.92rem;color:var(--mut);border-left:4px solid var(--c4);padding-left:12px;margin:18px 0}
@media (prefers-reduced-motion:no-preference){.pop{animation:pop .35s ease-out}@keyframes pop{from{transform:scale(.97);opacity:.4}to{transform:none;opacity:1}}}
@media (prefers-reduced-motion:reduce){.orb{transition:none!important}}
</style>
</head>
<body>
<main id="app"></main>
<script>
const W=[["☀️","Plutôt calme"],["🌤️","Un peu agité"],["⛅","Ça secoue"],["🌧️","Fort"],["⛈️","Très fort"]];
const wi=v=>Math.min(4,Math.floor(v/2.2));
const ST=[
{id:"intro"},
{id:"meteo",e:"🌦️",n:"Ma météo du moment",c:"var(--c1)",intro:"Aucune émotion n’est « mauvaise » : elles donnent toutes une information. Choisis celles qui sont là, aujourd’hui ou ces derniers jours.",
 secs:[{t:"chips",k:"emo",q:"Ce que je ressens",items:["😊 Joie","😢 Tristesse","😡 Colère","😰 Peur, anxiété","😳 Honte","😒 Jalousie","🥱 Ennui","😴 Fatigue","🌟 Fierté","🫂 Solitude","😖 Culpabilité","🤯 Débordé","😶 Vide","🥰 Amour","😤 Frustration","🤢 Dégoût"]},
 {t:"slider"},
 {t:"text",x:"emoT",q:"Je le dis avec mes mots",ph:"En ce moment, je me sens…"}]},
{id:"corps",e:"🫀",n:"Mon corps me parle",c:"var(--c2)",intro:"Le corps réagit souvent avant la tête. Repérer ces signaux aide à comprendre ce qui se passe.",
 secs:[{t:"chips",k:"body",q:"Ce que je remarque",items:["🫨 Boule au ventre","💓 Cœur qui s’accélère","✊ Poings ou mâchoire serrés","😮‍💨 Gorge nouée","🥵 Chaleur, tête qui chauffe","🧱 Épaules tendues","🌀 Pensées qui tournent","🔋 Plus d’énergie","🫥 Je ne sens rien"],x:"bodyT",ph:"Où ça se passe dans mon corps ? Comment ça se présente ?"}]},
{id:"decl",e:"⚡",n:"Ce qui déclenche",c:"var(--c3)",intro:"Comprendre ce qui fait monter une émotion permet de s’y préparer.",
 secs:[{t:"chips",k:"trig",q:"Ce qui me fait monter",items:["💬 Une dispute","📝 Un contrôle, une note","📱 Un message ou un silence","🎞️ Les réseaux sociaux","👀 Le regard des autres","🪑 Être seul","😴 Manque de sommeil","🏋️ La pression","🔄 Un changement","🙊 Une injustice","🏠 Une tension à la maison"],x:"trigT",ph:"Une situation récente où ça a monté…"},
 {t:"text",x:"trigT2",q:"Ce que je me suis dit dans ma tête",ph:"Les pensées qui m’ont traversé à ce moment-là…"}]},
{id:"outils",e:"🧰",n:"Ma boîte à outils",c:"var(--c4)",intro:"On sait souvent déjà ce qui aide, et ce qui aggrave. Fais l’inventaire.",
 secs:[{t:"chips",k:"help",q:"Ce qui m’aide à redescendre",items:["🌬️ Respirer lentement","🚶 Marcher dehors","🏃 Bouger, faire du sport","✍️ Écrire ce que je ressens","🎧 Écouter de la musique","🗣️ En parler à quelqu’un","🎨 Dessiner, créer","🛋️ Me poser au calme","📵 Faire une pause d’écran","🐾 Câliner un animal","😴 Me reposer"]},
 {t:"chips",k:"worse",q:"Ce qui aggrave les choses",items:["🔁 Ressasser en boucle","📱 Scroller sans fin","🤐 Tout garder pour moi","🌋 Exploser sur les autres","🚪 M’isoler trop longtemps","🙈 Faire comme si de rien n’était","🌙 Veiller tard"],x:"toolT",ph:"Un outil à tester cette semaine…"}]},
{id:"resp",e:"🌬️",n:"Je me pose 2 minutes",c:"var(--c1)"},
{id:"plan",e:"🗺️",n:"Mon plan « quand ça monte »",c:"var(--c2)"}
];
const KA=["emo","body","trig","help","worse"],KT=["emoT","bodyT","trigT","trigT2","toolT","sig","act","per","phr"];
let S=null,step=0,bt=[];
try{S=JSON.parse(localStorage.getItem("ado_emotions")||"null")}catch(e){}
S=S||{};KA.forEach(k=>S[k]=S[k]||[]);KT.forEach(k=>S[k]=S[k]||"");S.lvl=S.lvl==null?4:S.lvl;
const save=()=>{try{localStorage.setItem("ado_emotions",JSON.stringify(S))}catch(e){}};
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
const $=s=>document.querySelector(s);
const stopB=()=>{bt.forEach(clearTimeout);bt=[]};

function dots(){return `<div class="dots">${ST.map((_,i)=>`<i class="${i<=step?"on":""}"></i>`).join("")}</div>`}
function nav(l){return `<div class="nav">${step?`<button class="btn ghost" data-go="-1">Retour</button>`:""}${l?`<button class="btn" data-go="1">${l}</button>`:""}</div>`}
function ta(x,ph,m){return `<textarea data-x="${x}" placeholder="${ph}"${m?` style="min-height:${m}px"`:""}>${esc(S[x])}</textarea>`}
function sec(s){
 if(s.t==="slider"){const w=W[wi(S.lvl)];return `<section class="card slider"><h2>Son intensité aujourd’hui</h2><div class="wx" id="wx">${w[0]}</div><div class="lab" id="wl">${w[1]} · ${S.lvl}/10</div><input type="range" id="lvl" min="0" max="10" value="${S.lvl}" aria-label="Intensité de 0 à 10"><div class="alert" id="al" ${S.lvl>=8?"":"hidden"}>C’est fort, et ça peut être épuisant. Essaie la pause « Je me pose 2 minutes », et parle-en à quelqu’un en qui tu as confiance.</div></section>`}
 if(s.t==="text")return `<section class="card"><h2>${s.q}</h2>${ta(s.x,s.ph)}</section>`;
 return `<section class="card"><h2>${s.q}</h2><div class="chips">${s.items.map(c=>`<button class="chip" data-k="${s.k}" data-c="${esc(c)}" aria-pressed="${S[s.k].includes(c)}">${c}</button>`).join("")}</div>${s.x?ta(s.x,s.ph):""}</section>`;
}
function render(){
 stopB();const s=ST[step];let h=dots();
 $("#app").style.setProperty("--z",s.c||"var(--c1)");
 if(step===0){
  h+=`<div class="pop"><div class="hero">🌦️</div><h1>Ma météo intérieure</h1>
  <p style="margin-top:12px">Colère, stress, tristesse, joie… Les émotions, c’est comme la météo : ça change, ça passe, et on peut apprendre à s’y préparer.</p>
  <p class="sub">Ici, tu repères ce que tu ressens, ce que ton corps te dit, ce qui déclenche tout ça, puis tu construis ton plan pour t’apaiser. Rien n’est envoyé : tout reste sur ton appareil.</p></div>${nav("C’est parti")}`;
 } else if(s.id==="resp"){
  h+=`<div class="pop"><div class="hero">${s.e}</div><h1 style="font-size:1.8rem;margin-bottom:12px">${s.n}</h1><p class="sub">Expirer plus longtemps qu’on inspire aide le corps à ralentir. Cinq cycles, c’est environ une minute.</p>
  <section class="card"><div class="stage"><div class="orb" id="orb" aria-hidden="true">🌬️</div></div><div class="bmsg" id="bmsg" aria-live="polite">Installe-toi, épaules détendues, puis lance.</div><div class="nav"><button class="btn" id="bstart">Commencer</button></div></section>
  <section class="card"><h2>Ancrage 5-4-3-2-1</h2><p class="sub">Si ça tourne dans ta tête, ramène l’attention sur ce qui t’entoure. Touche chaque étape quand c’est fait.</p><div class="chips">${["👀 5 choses que je vois","✋ 4 choses que je touche","👂 3 sons que j’entends","👃 2 odeurs","👅 1 goût"].map(c=>`<button class="chip" data-g="1" aria-pressed="false">${c}</button>`).join("")}</div></section></div>${nav("Faire mon plan")}`;
 } else if(s.id==="plan"){
  const w=W[wi(S.lvl)][0],emo=S.emo.length?S.emo.map(x=>`<span class="chip" style="cursor:default" aria-pressed="true">${x}</span>`).join(" "):`<span class="sub">Aucune émotion choisie</span>`;
  h+=`<div class="pop"><div class="hero">${s.e}</div><h1 style="font-size:1.8rem;margin-bottom:12px">${s.n}</h1>
  <section class="card" style="text-align:center"><div style="font-size:3rem">${w}</div><p class="sub" style="margin-bottom:8px">Mon bulletin du moment</p><div class="chips" style="justify-content:center;margin:0">${emo}</div></section>
  <section class="card"><h2>1. Mon signal d’alerte</h2>${ta("sig","Ce que je remarque quand ça monte (corps, pensées, comportement)…")}</section>
  <section class="card"><h2>2. Mon action pendant 2 minutes</h2>${ta("act","Respirer, marcher, musique, boire de l’eau, m’éloigner un instant…")}</section>
  <section class="card"><h2>3. La personne à qui je peux parler</h2>${ta("per","Un parent, un ami, un prof, l’infirmier scolaire… et ce que je pourrais lui dire.",60)}</section>
  <section class="card"><h2>4. Ce que je peux me dire</h2>${ta("phr","Une phrase bienveillante, comme à un ami…",60)}</section>
  <section class="card"><h2>Mon récap</h2><textarea id="recap" readonly style="min-height:170px">${esc(recap())}</textarea><div class="nav"><button class="btn" id="copy">Copier mon récap</button></div><p class="sub" id="msg" style="margin:8px 0 0"></p></section>
  <p class="note">Ressentir des émotions fortes est normal. Mais si tu te sens mal depuis longtemps, ou si tu as des idées noires, parles-en rapidement à un adulte de confiance ou à un professionnel. En France : le 3114 (détresse, 24h/24), le 119 (enfance en danger) et le 3018 (harcèlement et cyberharcèlement) sont gratuits.</p>
  <div class="nav"><button class="btn ghost" data-go="-1">Retour</button><button class="btn ghost" id="reset">Tout effacer</button></div></div>`;
 } else {
  h+=`<div class="pop"><div class="hero">${s.e}</div><h1 style="font-size:1.8rem;margin-bottom:8px">${s.n}</h1><p class="sub">${s.intro}</p>${s.secs.map(sec).join("")}</div>${nav("Suite")}`;
 }
 $("#app").innerHTML=h;window.scrollTo(0,0);
}
function recap(){
 const j=(a,t)=>[...a,t].filter(x=>x&&x.trim()).join(" / ");
 return `🌦️ MA MÉTÉO : ${j(S.emo,S.emoT)} (intensité ${S.lvl}/10)\n🫀 MON CORPS : ${j(S.body,S.bodyT)}\n⚡ CE QUI DÉCLENCHE : ${j(S.trig,S.trigT)}\n💭 MES PENSÉES : ${S.trigT2}\n\n✅ CE QUI M’AIDE : ${j(S.help,S.toolT)}\n⚠️ CE QUI AGGRAVE : ${j(S.worse,"")}\n\n🗺️ QUAND ÇA MONTE\n1. Mon signal : ${S.sig}\n2. Mon action : ${S.act}\n3. Je peux parler à : ${S.per}\n4. Je me dis : ${S.phr}`;
}
function startB(){
 stopB();const o=$("#orb"),m=$("#bmsg"),b=$("#bstart");let n=0;b.textContent="Arrêter";b.dataset.on="1";
 const cyc=()=>{
  if(n>=5){m.textContent="Bien joué ✅ Comment te sens-tu maintenant ?";o.style.transform="scale(.6)";b.textContent="Recommencer";b.dataset.on="";return}
  m.textContent=`Cycle ${n+1}/5 · Inspire par le nez… (4 s)`;o.style.transition="transform 4s ease-in-out";o.style.transform="scale(1)";
  bt.push(setTimeout(()=>{m.textContent=`Cycle ${n+1}/5 · Souffle doucement par la bouche… (6 s)`;o.style.transition="transform 6s ease-in-out";o.style.transform="scale(.6)"},4000));
  bt.push(setTimeout(()=>{n++;cyc()},10000));
 };cyc();
}
document.addEventListener("click",e=>{
 const t=e.target.closest("button");if(!t)return;
 if(t.dataset.go){step=Math.max(0,Math.min(ST.length-1,step+ +t.dataset.go));render();return}
 if(t.dataset.k){const a=S[t.dataset.k],c=t.dataset.c,i=a.indexOf(c);if(i>=0)a.splice(i,1);else a.push(c);t.setAttribute("aria-pressed",i<0);save();return}
 if(t.dataset.g){t.setAttribute("aria-pressed",t.getAttribute("aria-pressed")!=="true");return}
 if(t.id==="bstart"){if(t.dataset.on){stopB();render()}else startB();return}
 if(t.id==="copy"){const r=$("#recap"),m=$("#msg");
  try{navigator.clipboard.writeText(r.value).then(()=>m.textContent="Copié ✅",()=>{r.select();m.textContent="Sélectionné : copie-le à la main."})}catch(x){r.select();m.textContent="Sélectionné : copie-le à la main."}return}
 if(t.id==="reset"&&confirm("Tout effacer et recommencer ?")){KA.forEach(k=>S[k]=[]);KT.forEach(k=>S[k]="");S.lvl=4;save();step=0;render()}
});
document.addEventListener("input",e=>{
 const t=e.target;
 if(t.dataset&&t.dataset.x){S[t.dataset.x]=t.value;save();const r=$("#recap");if(r)r.value=recap()}
 if(t.id==="lvl"){S.lvl=+t.value;save();const w=W[wi(S.lvl)];$("#wx").textContent=w[0];$("#wl").textContent=w[1]+" · "+S.lvl+"/10";$("#al").hidden=S.lvl<8}
});
render();
</script>
</body>
</html>
